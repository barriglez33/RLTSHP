name: Update Relationship News RSS

on:
  workflow_dispatch:

  schedule:
    - cron: "37 * * * *"

concurrency:
  group: relationship-news-rss
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Python dependencies
        run: |
          python -c "import feedparser, requests, trafilatura; print('Core imports OK')"
          python -c "from googlenewsdecoder import gnewsdecoder; print('Google News decoder OK')"
          python -c "from deep_translator import GoogleTranslator, MyMemoryTranslator; print('Translation imports OK')"
          python -c "from langdetect import detect; print('Language detection OK')"

      - name: Update Relationship News — rolling 2h batch
        env:
          PYTHONUNBUFFERED: "1"
        run: python main.py

      - name: Commit generated RSS and data
        run: |
          git config user.name "Relationship News Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data docs

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Relationship News"
            git push
          fi
